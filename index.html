<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Price Calculator - Calculate Price Per Unit (g, mL, kg, L)</title>
    <meta name="description" content="Free online grocery price calculator to convert product prices to standard units. Enter price and quantity to instantly see price per 100g, 1kg, 100mL, 1L, and per unit.">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 32px;
            width: 100%;
            max-width: 600px;
            min-height: 550px;
            display: flex;
            flex-direction: column;
        }

        h1 {
            margin: 0 0 24px 0;
            font-size: 24px;
            color: #333;
            text-align: center;
        }

        .input-row {
            display: flex;
            gap: 16px;
        }

        .input-group {
            flex: 1;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            transition: border-color 0.2s;
        }

        /* Hide number input spinners */
        .input-group input::-webkit-outer-spin-button,
        .input-group input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .input-group input[type="number"] {
            -moz-appearance: textfield;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-group input.price-input {
            text-align: right;
        }

        .input-group input.quantity-input {
            text-align: right;
        }

        .results {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 2px solid #e0e0e0;
        }

        .results h2 {
            margin: 0 0 16px 0;
            font-size: 16px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .results-grid {
            display: grid;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 16px;
        }

        .result-pair {
            display: flex;
            flex-direction: row;
            gap: 8px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #f8f9fa;
            border-radius: 8px;
            width: 50%;
        }

        .result-value {
            font-size: 20px;
            font-weight: 700;
            color: #000;
            text-wrap: nowrap;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            font-size: 16px;
            color: #555;
        }

        .copy-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .copy-btn:hover {
            background: #5a6fd6;
        }

        .copy-btn:active {
            background: #4e5ebf;
        }

        .note {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Grocery Price Calculator</h1>

        <div class="input-row">
            <div class="input-group">
                <label for="price">Price ($)</label>
                <input type="text" id="price" placeholder="0.00" inputmode="decimal" pattern="^\d*\.?\d{0,2}$" class="price-input" autofocus>
            </div>

            <div class="input-group">
                <label for="quantity-g">Quantity (g, mL or unit)</label>
                <input type="number" id="quantity-g" placeholder="0" step="any" min="0" class="quantity-input">
            </div>

            <div class="input-group">
                <label for="quantity-kg">Quantity (kg or L)</label>
                <input type="number" id="quantity-kg" placeholder="0" step="any" min="0" class="quantity-input">
            </div>
        </div>

        <div class="results" style="flex: 1;">
            <h2>Price Comparison</h2>
            <div id="results-container">
                <div class="results-grid">
                    <div class="result-pair">
                        <div class="result-item">
                            <span class="result-value" id="result-1g"></span>
                            <button class="copy-btn" data-result="1g">Copy</button>
                        </div>
                        <div class="result-item">
                            <span class="result-value" id="result-100g"></span>
                            <button class="copy-btn" data-result="100g">Copy</button>
                        </div>
                        <div class="result-item">
                            <span class="result-value" id="result-1kg"></span>
                            <button class="copy-btn" data-result="1kg">Copy</button>
                        </div>
                    </div>
                    <div class="result-pair">
                        <div class="result-item">
                            <span class="result-value" id="result-1ml"></span>
                            <button class="copy-btn" data-result="1ml">Copy</button>
                        </div>
                        <div class="result-item">
                            <span class="result-value" id="result-100ml"></span>
                            <button class="copy-btn" data-result="100ml">Copy</button>
                        </div>
                        <div class="result-item">
                            <span class="result-value" id="result-1l"></span>
                            <button class="copy-btn" data-result="1l">Copy</button>
                        </div>
                    </div>
                    <div class="result-pair">
                        <div class="result-item">
                            <span class="result-value" id="result-unit"></span>
                            <button class="copy-btn" data-result="unit">Copy</button>
                        </div>
                    </div>
                </div>
            </div>
            <div id="instruction-container" class="note">Enter price and quantity to see standardised prices per unit (g, mL, kg, L)</div>
        </div>

        <div class="note">Press Tab or Enter/Return to navigate • Results update automatically</div>
        <div class="note" style="margin-top: 16px; text-align: center;">
            <a href="https://github.com/trevorpeacock/grocery_price_per_unit_calculator" target="_blank" rel="noopener noreferrer">View on GitHub</a>
        </div>
    </div>

    <script>
        const priceInput = document.getElementById('price');
        const quantityGInput = document.getElementById('quantity-g');
        const quantityKgInput = document.getElementById('quantity-kg');
        const resultsContainer = document.getElementById('results-container');
        const instructionContainer = document.getElementById('instruction-container');

        function formatMoney(amount) {
            if (amount < 1) {
                // Show at least 2 significant digits for cents
                const cents = amount * 100;
                if (cents < 1) {
                    return cents.toFixed(2) + 'c';
                } else if (cents < 10) {
                    return cents.toFixed(1) + 'c';
                } else {
                    return Math.round(cents) + 'c';
                }
            }
            return '$' + amount.toFixed(2);
        }

        function updateQuantities(source) {
            const gValue = parseFloat(quantityGInput.value) || 0;
            const kgValue = parseFloat(quantityKgInput.value) || 0;

            if (source === 'g') {
                // Only update if the value is different to avoid infinite loop
                const newKgValue = gValue / 1000;
                if (quantityKgInput.value != newKgValue) {
                    quantityKgInput.value = newKgValue;
                }
            } else if (source === 'kg') {
                // Only update if the value is different to avoid infinite loop
                const newGValue = kgValue * 1000;
                if (quantityGInput.value != newGValue) {
                    quantityGInput.value = newGValue;
                }
            }

            calculateAndDisplay();
        }

        function calculateAndDisplay() {
            const price = parseFloat(priceInput.value);
            const gValue = parseFloat(quantityGInput.value) || 0;
            const kgValue = parseFloat(quantityKgInput.value) || 0;

            // Use whichever quantity is provided (non-zero)
            let quantity = gValue > 0 ? gValue : (kgValue > 0 ? kgValue * 1000 : 0);

            if (isNaN(price) || price < 0 || quantity <= 0) {
                resultsContainer.style.display = 'none';
                instructionContainer.style.display = 'block';
                return;
            }

            const pricePerUnit = price / quantity;

            // Update result values
            document.getElementById('result-1g').textContent = formatMoney(pricePerUnit) + ' per g';
            document.getElementById('result-100g').textContent = formatMoney(pricePerUnit * 100) + ' per 100g';
            document.getElementById('result-1kg').textContent = formatMoney(pricePerUnit * 1000) + ' per kg';
            document.getElementById('result-1ml').textContent = formatMoney(pricePerUnit) + ' per mL';
            document.getElementById('result-100ml').textContent = formatMoney(pricePerUnit * 100) + ' per 100mL';
            document.getElementById('result-1l').textContent = formatMoney(pricePerUnit * 1000) + ' per L';
            document.getElementById('result-unit').textContent = formatMoney(pricePerUnit) + ' per unit';

            if(pricePerUnit>0.1) {
                document.getElementById('result-1g').parentElement.style.display = 'flex';
                document.getElementById('result-1kg').parentElement.style.display = 'none';
                document.getElementById('result-1ml').parentElement.style.display = 'flex';
                document.getElementById('result-1l').parentElement.style.display = 'none';
            } else {
                document.getElementById('result-1g').parentElement.style.display = 'none';
                document.getElementById('result-1kg').parentElement.style.display = 'flex';
                document.getElementById('result-1ml').parentElement.style.display = 'none';
                document.getElementById('result-1l').parentElement.style.display = 'flex';
            }
            resultsContainer.style.display = 'block';
            instructionContainer.style.display = 'none';
        }

        // Add event listeners for real-time updates
        priceInput.addEventListener('input', calculateAndDisplay);
        quantityGInput.addEventListener('input', () => updateQuantities('g'));
        quantityKgInput.addEventListener('input', () => updateQuantities('kg'));

        // Track if user has entered a value in quantity fields
        let gValueEntered = false;
        let kgValueEntered = false;

        // Handle Enter and Tab keys to advance focus
        const inputs = [priceInput, quantityGInput, quantityKgInput];
        inputs.forEach((input, index) => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || (e.key === 'Tab' && !e.shiftKey)) {
                    e.preventDefault();

                    let nextIndex = index + 1;

                    // Loop back to zero if we've gone past the last input
                    if (nextIndex >= inputs.length) {
                        nextIndex = 0;
                    }

                    // If gValue is entered, go back to price entry
                    if (index === 1 && gValueEntered) {
                        nextIndex = 0;
                    }

                    inputs[nextIndex].focus();
                }
            });
        });

        // Track when user types in quantity fields
        quantityGInput.addEventListener('input', () => {
            gValueEntered = quantityGInput.value.trim() !== '';
        });

        quantityKgInput.addEventListener('input', () => {
            kgValueEntered = quantityKgInput.value.trim() !== '';
        });

        // Reset state when returning to price field
        priceInput.addEventListener('focus', () => {
            gValueEntered = false;
            kgValueEntered = false;
        });

        // Select all text when any input is focused
        const allInputs = [priceInput, quantityGInput, quantityKgInput];
        allInputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.select();
            });
        });

        // Format price input to always show two decimal places as user types
        priceInput.addEventListener('input', () => {
            let value = priceInput.value.replace(/[^0-9]/g, '');
            if (value === '') return;
            
            // Remove leading zeroes
            value = value.replace(/^0+/, '') || '0';
            
            // Add decimal point if needed
            if (value.length === 1) {
                priceInput.value = '0.0' + value;
            } else if (value.length === 2) {
                priceInput.value = '0.' + value;
            } else {
                priceInput.value = value.slice(0, -2) + '.' + value.slice(-2);
            }

            calculateAndDisplay();
        });

        // Initialize
        calculateAndDisplay();
        priceInput.focus();

        // Re-focus price input if clicking outside of any input
        document.addEventListener('click', (e) => {
            const target = e.target;
            if (!priceInput.contains(target) && !quantityGInput.contains(target) && !quantityKgInput.contains(target)) {
                priceInput.focus();
            }
        });

        // Copy text to clipboard
        document.querySelectorAll('.copy-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const resultId = this.getAttribute('data-result');
                const resultValue = document.getElementById('result-' + resultId).textContent;
                navigator.clipboard.writeText(resultValue);
                this.textContent = 'Copied!';
                setTimeout(function() {
                    this.textContent = 'Copy';
                }.bind(this), 1500);
            });
        });
    </script>
</body>
</html>
