<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Price Calculator</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 32px;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            margin: 0 0 24px 0;
            font-size: 24px;
            color: #333;
            text-align: center;
        }

        .input-row {
            display: flex;
            gap: 16px;
        }

        .input-group {
            flex: 1;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            transition: border-color 0.2s;
        }

        /* Hide number input spinners */
        .input-group input::-webkit-outer-spin-button,
        .input-group input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .input-group input[type="number"] {
            -moz-appearance: textfield;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-group input.price-input {
            text-align: right;
        }

        .input-group input.quantity-input {
            text-align: right;
        }

        .results {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 2px solid #e0e0e0;
        }

        .results h2 {
            margin: 0 0 16px 0;
            font-size: 16px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .results-grid {
            display: grid;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 16px;
        }

        .result-pair {
            display: flex;
            flex-direction: row;
            gap: 8px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #f8f9fa;
            border-radius: 8px;
            width: 50%;
        }

        .result-value {
            font-size: 20px;
            font-weight: 700;
            color: #000;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            font-size: 16px;
            color: #555;
        }

        .copy-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .copy-btn:hover {
            background: #5a6fd6;
        }

        .copy-btn:active {
            background: #4e5ebf;
        }

        .note {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Grocery Price Calculator</h1>

        <div class="input-row">
            <div class="input-group">
                <label for="price">Price ($)</label>
                <input type="text" id="price" placeholder="0.00" inputmode="decimal" pattern="^\d*\.?\d{0,2}$" class="price-input" autofocus>
            </div>

            <div class="input-group">
                <label for="quantity-g">Quantity (g, mL or unit)</label>
                <input type="number" id="quantity-g" placeholder="0" step="any" min="0" class="quantity-input">
            </div>

            <div class="input-group">
                <label for="quantity-kg">Quantity (kg or L)</label>
                <input type="number" id="quantity-kg" placeholder="0" step="any" min="0" class="quantity-input">
            </div>
        </div>

        <div class="results">
            <h2>Price Comparison</h2>
            <div id="results-container">
                <div class="note">Enter price and quantity to see standardised prices</div>
            </div>
        </div>

        <div class="note">Press Tab to navigate • Results update automatically</div>
    </div>

    <script>
        const priceInput = document.getElementById('price');
        const quantityGInput = document.getElementById('quantity-g');
        const quantityKgInput = document.getElementById('quantity-kg');
        const resultsContainer = document.getElementById('results-container');

        let isUpdating = false;

        function formatMoney(amount) {
            if (amount < 1) {
                return Math.round(amount * 100) + 'c';
            }
            return '$' + amount.toFixed(2);
        }

        function updateQuantities(source) {
            if (isUpdating) return;
            isUpdating = true;

            const gValue = parseFloat(quantityGInput.value) || 0;
            const kgValue = parseFloat(quantityKgInput.value) || 0;

            if (source === 'g') {
                quantityKgInput.value = gValue / 1000;
            } else if (source === 'kg') {
                quantityGInput.value = kgValue * 1000;
            }

            isUpdating = false;
            calculateAndDisplay();
        }

        function calculateAndDisplay() {
            const price = parseFloat(priceInput.value);
            const gValue = parseFloat(quantityGInput.value) || 0;
            const kgValue = parseFloat(quantityKgInput.value) || 0;

            // Use whichever quantity is provided (non-zero)
            let quantity = gValue > 0 ? gValue : (kgValue > 0 ? kgValue * 1000 : 0);

            if (isNaN(price) || price < 0 || quantity <= 0) {
                resultsContainer.innerHTML = '<div class="note">Enter price and quantity to see comparisons</div>';
                return;
            }

            const pricePerUnit = price / quantity;

            let results = [];

            // Show results for different units
            results.push({
                label: '100g',
                value: pricePerUnit * 100,
                highlight: true
            });
            results.push({
                label: '1kg',
                value: pricePerUnit * 1000
            });
            results.push({
                label: '100mL',
                value: pricePerUnit * 100
            });
            results.push({
                label: '1L',
                value: pricePerUnit * 1000
            });
            results.push({
                label: 'unit',
                value: pricePerUnit
            });

            let html = `
                <div class="results-grid">
                    <div class="result-pair">
                        <div class="result-item">
                            <span class="result-value">${formatMoney(results[0].value)} per ${results[0].label}</span>
                            <button class="copy-btn" onclick="copyToClipboard('${formatMoney(results[0].value)} per ${results[0].label}', this)">Copy</button>
                        </div>
                        <div class="result-item">
                            <span class="result-value">${formatMoney(results[1].value)} per ${results[1].label}</span>
                            <button class="copy-btn" onclick="copyToClipboard('${formatMoney(results[1].value)} per ${results[1].label}', this)">Copy</button>
                        </div>
                    </div>
                    <div class="result-pair">
                        <div class="result-item">
                            <span class="result-value">${formatMoney(results[2].value)} per ${results[2].label}</span>
                            <button class="copy-btn" onclick="copyToClipboard('${formatMoney(results[2].value)} per ${results[2].label}', this)">Copy</button>
                        </div>
                        <div class="result-item">
                            <span class="result-value">${formatMoney(results[3].value)} per ${results[3].label}</span>
                            <button class="copy-btn" onclick="copyToClipboard('${formatMoney(results[3].value)} per ${results[3].label}', this)">Copy</button>
                        </div>
                    </div>
                    <div class="result-pair">
                        <div class="result-item">
                            <span class="result-value">${formatMoney(results[4].value)} per ${results[4].label}</span>
                            <button class="copy-btn" onclick="copyToClipboard('${formatMoney(results[4].value)} per ${results[4].label}', this)">Copy</button>
                        </div>
                    </div>
                </div>
            `;

            resultsContainer.innerHTML = html;
        }

        // Add event listeners for real-time updates
        priceInput.addEventListener('input', calculateAndDisplay);
        quantityGInput.addEventListener('input', () => updateQuantities('g'));
        quantityKgInput.addEventListener('input', () => updateQuantities('kg'));

        // Track if user has entered a value in quantity fields
        let gValueEntered = false;
        let kgValueEntered = false;

        // Handle Enter and Tab keys to advance focus
        const inputs = [priceInput, quantityGInput, quantityKgInput];
        inputs.forEach((input, index) => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || (e.key === 'Tab' && !e.shiftKey)) {
                    e.preventDefault();

                    let nextIndex;
                    if (index === 0) {
                        // Price field - always go to g quantity
                        nextIndex = 1;
                    } else if (index === 1) {
                        // g quantity field
                        if (gValueEntered) {
                            // If user typed something, go back to price
                            nextIndex = 0;
                        } else {
                            // If no value, go to kg quantity
                            nextIndex = 2;
                        }
                    } else {
                        // kg quantity field - always go back to price
                        nextIndex = 0;
                    }

                    inputs[nextIndex].focus();
                }
            });
        });

        // Track when user types in quantity fields
        quantityGInput.addEventListener('input', () => {
            gValueEntered = quantityGInput.value.trim() !== '';
        });

        quantityKgInput.addEventListener('input', () => {
            kgValueEntered = quantityKgInput.value.trim() !== '';
        });

        // Reset state when returning to price field
        priceInput.addEventListener('focus', () => {
            gValueEntered = false;
            kgValueEntered = false;
        });

        // Select all text when any input is focused
        const allInputs = [priceInput, quantityGInput, quantityKgInput];
        allInputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.select();
            });
        });

        // Format price input to always show two decimal places as user types
        priceInput.addEventListener('input', () => {
            let value = priceInput.value.replace(/[^0-9]/g, '');
            if (value === '') return;
            
            // Remove leading zeroes
            value = value.replace(/^0+/, '') || '0';
            
            // Add decimal point if needed
            if (value.length === 1) {
                priceInput.value = '0.0' + value;
            } else if (value.length === 2) {
                priceInput.value = '0.' + value;
            } else {
                priceInput.value = value.slice(0, -2) + '.' + value.slice(-2);
            }
        });

        // Initialize
        calculateAndDisplay();
        priceInput.focus();

        // Re-focus price input if clicking outside of any input
        document.addEventListener('click', (e) => {
            const target = e.target;
            if (!priceInput.contains(target) && !quantityGInput.contains(target) && !quantityKgInput.contains(target)) {
                priceInput.focus();
            }
        });

        // Copy text to clipboard
        window.copyToClipboard = function(text, btn) {
            navigator.clipboard.writeText(text).then(function() {
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(function() {
                    btn.textContent = originalText;
                }, 1500);
            }).catch(function(err) {
                console.error('Failed to copy: ', err);
            });
        };
    </script>
</body>
</html>
